[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-receipt"
version = "1.0.1"
description = "Reject 'done' from an AI agent when no file or tool evidence exists."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ironeye11-bot" }]
keywords = ["llm", "agent", "evaluation", "cli", "local-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Intended Audience :: Developers",
]
dependencies = []

[project.scripts]
agent-receipt = "agent_receipt.cli:main"

[project.urls]
Homepage = "https://github.com/ironeye11-bot/agent-receipt"
Issues = "https://github.com/ironeye11-bot/agent-receipt/issues"

[tool.setuptools.packages.find]
where = ["src"]
