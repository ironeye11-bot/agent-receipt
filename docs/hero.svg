<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Agent Receipt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12070f"/>
      <stop offset="55%" stop-color="#1a0d18"/>
      <stop offset="100%" stop-color="#071016"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#ffd36a"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#ff6b4a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1040" cy="140" r="260" fill="url(#glow)"/>
  <g transform="translate(760,150)">
    <rect x="0" y="0" width="430" height="280" rx="20" fill="#160b14" stroke="#ff6b4a" stroke-width="3"/>
    <text x="28" y="52" fill="#ffd36a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">CLAIM</text>
    <text x="28" y="86" fill="#f6e6df" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="22">“Done. File created.”</text>
    <text x="28" y="140" fill="#ffd36a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">DISK</text>
    <text x="28" y="176" fill="#ff8a7a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22">0 files written</text>
    <rect x="28" y="214" width="170" height="40" rx="8" fill="#ff6b4a"/>
    <text x="52" y="241" fill="#12070f" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="22" font-weight="700">FAIL</text>
  </g>
  <text x="72" y="230" fill="#fff4ee" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="64" font-weight="700">Agent Receipt</text>
  <text x="72" y="300" fill="#ffd36a" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="30">If the file is not there, it is not done.</text>
  <text x="72" y="372" fill="#c9b4ae" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">agent-receipt --ask "..." --reply "Done." --dir ./out</text>
</svg>
