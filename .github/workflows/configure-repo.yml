name: Configure repository metadata

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo edit "$GITHUB_REPOSITORY" --description "Fertig vom Agenten blocken, wenn keine Datei da ist." --enable-issues=true --enable-wiki=false --enable-projects=false --add-topic llm --add-topic agents --add-topic cli --add-topic evaluation --add-topic python --add-topic local-ai
